name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}${{ (github.event_name == 'push' || inputs.dry_run != false) && ' (dry run)' || '' }}

# One path to production: a tag.
#
#   * A tag push runs the whole pipeline as a DRY RUN: every build happens,
#     every deploy/publish/upload step prints what it would do, nothing
#     leaves the runner.
#   * The real release is "Run workflow" with the tag and dry_run = false.
#     The publish job is bound to the `production` environment, so it also
#     needs one approval click there.
#   * only_api = true redeploys an existing tag's API binary (hotfix); the
#     installers, GitHub release, manifest and web deploy are skipped.
#
# Job graph:  build-windows ─┐
#             build-linux   ─┼─► publish ─► manifest
#             build-macos   ─┤      │
#             build-api ─► deploy-api      └─► web
#
# publish depends on deploy-api's health check: the GitHub release and the
# manifest never go out unless the new API is live and reports the tag's
# version, so 0.5.0 clients cannot meet a 0.4.x server.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z); must already exist'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build and verify, but do not deploy, publish or upload'
        required: true
        type: boolean
        default: true
      only_api:
        description: 'Only rebuild and redeploy the API for this tag (hotfix redeploy)'
        required: false
        type: boolean
        default: false
      min_supported_version:
        description: 'Override min_supported_version in the app manifest (X.Y.Z); default: the .release marker or the live value'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  # push events have no inputs: always a dry run.
  DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run != false }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  ONLY_API: ${{ inputs.only_api == true }}
  API_URL: https://api.kashshaf.com
  API_SSH_HOST: ${{ vars.API_SSH_HOST || '5.161.127.18' }}
  API_SSH_USER: ${{ vars.API_SSH_USER || 'kashshaf' }}
  CDN_URL: https://cdn.kashshaf.com

jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ env.DRY_RUN }}
      only_api: ${{ env.ONLY_API }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: v
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG dry_run=$DRY_RUN only_api=$ONLY_API"
      - name: Versions agree with the tag
        run: python3 scripts/check_release.py --local --tag "$RELEASE_TAG"

  build-windows:
    needs: meta
    if: needs.meta.outputs.only_api != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kashshaf-windows
          path: target/release/bundle/msi/*.msi

  build-linux:
    needs: meta
    if: needs.meta.outputs.only_api != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kashshaf-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  build-macos:
    needs: meta
    if: needs.meta.outputs.only_api != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          security set-keychain-settings -t 7200 -u build.keychain
      - run: npm ci
      # rust-cache saves the whole target/ tree, and its cleanup only prunes
      # cargo's own directories, so a previous run's signed bundles come back
      # with the cache. Left in place, `cp -R` below copies the new app *into*
      # the old one and codesign fails with "unsealed contents present in the
      # bundle root". Start from no bundles.
      - name: Remove bundles left by a restored cache
        run: |
          rm -rf target/universal \
                 target/aarch64-apple-darwin/release/bundle \
                 target/x86_64-apple-darwin/release/bundle || true
      - name: Build arm64 (no notarization)
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          SKIP_NOTARIZATION: true
      - name: Build x86_64 (no notarization)
        run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          SKIP_NOTARIZATION: true
      - name: Create universal app
        run: |
          ARM_APP="target/aarch64-apple-darwin/release/bundle/macos/Kashshaf.app"
          INTEL_APP="target/x86_64-apple-darwin/release/bundle/macos/Kashshaf.app"
          UNIVERSAL_APP="target/universal/Kashshaf.app"
          # Never copy into an existing bundle (see the clean step above).
          rm -rf "$UNIVERSAL_APP"
          mkdir -p target/universal
          cp -R "$ARM_APP" "$UNIVERSAL_APP"
          lipo -create \
            "$ARM_APP/Contents/MacOS/kashshaf" \
            "$INTEL_APP/Contents/MacOS/kashshaf" \
            -output "$UNIVERSAL_APP/Contents/MacOS/kashshaf"
          lipo -info "$UNIVERSAL_APP/Contents/MacOS/kashshaf"
      - name: Show bundle layout before signing
        run: |
          echo "--- target/universal/"; ls -la target/universal/ || true
          echo "--- target/universal/Kashshaf.app/ (must contain only Contents/)"; ls -la target/universal/Kashshaf.app/ || true
          echo "--- target/universal/Kashshaf.app/Contents/"; ls -la target/universal/Kashshaf.app/Contents/ || true
          echo "--- *.app under target (maxdepth 6)"; find target -maxdepth 6 -name '*.app' || true
          echo "--- target/universal-apple-darwin/release/bundle/macos/ (Tauri's own universal output, unused here)"
          ls -la target/universal-apple-darwin/release/bundle/macos/ || true
          echo "--- signature the bundler left on the copied arm64 app"; codesign -dv target/universal/Kashshaf.app 2>&1 || true
      # The bundler (bundle.macOS.signingIdentity in tauri.conf.json) signed
      # both single-arch apps, but lipo replaced the main executable, so the
      # universal bundle must be signed again. Sign the bundle itself, not
      # --deep: Apple deprecated --deep and it rejects bundles with nested
      # content; nested items keep the bundler's signatures.
      - name: Re-sign universal app
        run: |
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: Antonio Musto (ALLW8R237Y)" \
            target/universal/Kashshaf.app
          codesign --verify --deep --strict --verbose=2 target/universal/Kashshaf.app
          codesign -dv --verbose=2 target/universal/Kashshaf.app 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|Timestamp|flags' || true
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent target/universal/Kashshaf.app Kashshaf.zip
          xcrun notarytool submit Kashshaf.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
      - run: xcrun stapler staple target/universal/Kashshaf.app
      - name: Create DMG
        run: |
          VERSION=${RELEASE_TAG#v}
          hdiutil create -volname "Kashshaf" -srcfolder target/universal/Kashshaf.app -ov -format UDZO Kashshaf_${VERSION}_macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: kashshaf-macos
          path: Kashshaf_*_macos.dmg
      # Runs before rust-cache's post step saves target/, so bundles never
      # enter the cache in the first place.
      - name: Drop bundles before the cache is saved
        if: always()
        run: |
          rm -rf target/universal \
                 target/aarch64-apple-darwin/release/bundle \
                 target/x86_64-apple-darwin/release/bundle || true

  build-api:
    needs: meta
    # Static musl binary: it does not depend on the server's glibc, so the
    # runner's Ubuntu release does not matter. If a musl build ever fails
    # to link (rusqlite bundled and tantivy's zstd both compile with
    # musl-gcc today), switch to `container: ubuntu:<server release>` and a
    # glibc build; see api/deploy/README.md.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build kashshaf-api (static)
        run: cargo build --release -p kashshaf-api --target x86_64-unknown-linux-musl
      - name: Verify the binary is static and reports the tag's version
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/kashshaf-api
          file "$BIN"
          # Capture first: under pipefail, `ldd | grep -q` can fail with 141
          # when grep exits before ldd finishes writing.
          LDD=$(ldd "$BIN" 2>&1 || true)
          if grep -q "not a dynamic executable\|statically linked" <<<"$LDD"; then echo "static: ok"; else echo "binary is dynamically linked:"; echo "$LDD"; exit 1; fi
          # The server reports CARGO_PKG_VERSION on /health; it must equal the tag.
          grep -q "${RELEASE_TAG#v}" Cargo.toml
          cp "$BIN" "kashshaf-api-${RELEASE_TAG}"
      - uses: actions/upload-artifact@v4
        with:
          name: kashshaf-api
          path: kashshaf-api-v*

  deploy-api:
    needs: [meta, build-api]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: kashshaf-api
          path: dist-api
      - name: Plan
        run: |
          set -euo pipefail
          ls -l dist-api
          cat <<EOF
          deploy plan for $RELEASE_TAG (dry_run=$DRY_RUN):
            stage/{kashshaf-api-$RELEASE_TAG,switch_release.sh,smoke.sh} (mode 755)
              -> scp (tar, strip_components 1) -> $API_SSH_USER@$API_SSH_HOST:/opt/kashshaf/api/incoming/
            ssh: mv incoming/kashshaf-api-$RELEASE_TAG bin/, mv the two scripts to /opt/kashshaf/api/, chmod 755,
                 sudo /opt/kashshaf/api/switch_release.sh $RELEASE_TAG
                 (repoint /opt/kashshaf/api/bin/current, systemctl restart kashshaf-api,
                  wait for /health.version == ${RELEASE_TAG#v} and warm_cache == complete,
                  smoke test; on failure repoint to the previous binary, restart, exit 1;
                  keep the last three binaries)
            then: scripts/check_release.py --post-deploy --tag $RELEASE_TAG --api $API_URL --no-manifest-version
          EOF
      # appleboy/scp-action (drone-scp) packs the `source` paths into one tar
      # exactly as written and extracts it on the server with
      # `tar -zxf … --strip-components N -C <target>`, so every source gets
      # the same number of leading components removed. The old list mixed
      # depths: `dist-api/<bin>` lost its one component, but
      # `api/deploy/*.sh` kept `deploy/` and landed in incoming/deploy/.
      # Stage everything in one flat directory first so the depth is uniform,
      # and make it executable here (download-artifact drops the mode bit;
      # tar preserves it).
      - name: Stage the files the server receives
        run: |
          set -euo pipefail
          rm -rf stage && mkdir stage
          cp "dist-api/kashshaf-api-$RELEASE_TAG" api/deploy/switch_release.sh api/deploy/smoke.sh stage/
          chmod 755 stage/*
          ls -l stage
      - name: Copy binary and scripts to the server
        if: env.DRY_RUN != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.API_SSH_HOST }}
          username: ${{ env.API_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "stage/kashshaf-api-${{ env.RELEASE_TAG }},stage/switch_release.sh,stage/smoke.sh"
          target: /opt/kashshaf/api/incoming
          strip_components: 1
          overwrite: true
      - name: Switch release on the server (health check, smoke test, rollback)
        if: env.DRY_RUN != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.API_SSH_HOST }}
          username: ${{ env.API_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            TAG="${{ env.RELEASE_TAG }}"
            cd /opt/kashshaf/api
            mkdir -p bin
            echo "incoming/ holds:"; find incoming -type f | sort
            # Accept either layout (flat, or nested under a stripped-short
            # directory) so a future change to the source list cannot
            # strand the files again. `-print -quit`, not `| head`: pipefail.
            for f in "kashshaf-api-$TAG" switch_release.sh smoke.sh; do
              src=$(find incoming -type f -name "$f" -print -quit)
              [ -n "$src" ] || { echo "$f not found anywhere under incoming/"; exit 1; }
              case "$f" in kashshaf-api-*) dest="bin/$f" ;; *) dest="./$f" ;; esac
              mv -f "$src" "$dest"
            done
            # The artifact download strips the executable bit; switch_release.sh
            # requires [ -x "$BIN" ], and the scripts are run directly.
            chmod 755 "bin/kashshaf-api-$TAG" switch_release.sh smoke.sh
            rm -rf incoming/* || true
            ls -l "bin/kashshaf-api-$TAG" switch_release.sh smoke.sh
            sudo ./switch_release.sh "$TAG"
      - name: Post-deploy checks from outside
        if: env.DRY_RUN != 'true'
        run: |
          python3 scripts/check_release.py --post-deploy --tag "$RELEASE_TAG" --api "$API_URL" --no-manifest-version
          bash api/deploy/smoke.sh "$API_URL" "${RELEASE_TAG#v}"
      - name: Dry run — rehearse the smoke test script against nothing
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          bash -n api/deploy/switch_release.sh && bash -n api/deploy/smoke.sh && echo "scripts parse; no server contacted"
          # What the server would receive: flat and executable.
          test -x "stage/kashshaf-api-$RELEASE_TAG" && test -x stage/switch_release.sh && test -x stage/smoke.sh
          tar -czf stage.tgz "stage/kashshaf-api-$RELEASE_TAG" stage/switch_release.sh stage/smoke.sh
          mkdir -p incoming-rehearsal && tar -xzf stage.tgz --strip-components 1 -C incoming-rehearsal
          ls -l incoming-rehearsal
          test -x "incoming-rehearsal/kashshaf-api-$RELEASE_TAG" && test -f incoming-rehearsal/switch_release.sh && test -f incoming-rehearsal/smoke.sh
          echo "staged files extract flat with strip_components 1"

  publish:
    needs: [meta, build-windows, build-linux, build-macos, deploy-api]
    if: needs.meta.outputs.only_api != 'true'
    runs-on: ubuntu-22.04
    # Needs one approval click in the `production` environment (configure
    # it in Settings → Environments with a required reviewer).
    environment: ${{ needs.meta.outputs.dry_run == 'true' && 'dry-run' || 'production' }}
    outputs:
      notes_path: RELEASE_NOTES.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release notes from docs/changelog.md
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          v = os.environ["RELEASE_TAG"][1:]
          text = pathlib.Path("docs/changelog.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, flags=re.M | re.S)
          if not m or not m.group(1).strip():
              raise SystemExit(f"docs/changelog.md has no ## [{v}] section")
          pathlib.Path("RELEASE_NOTES.md").write_text(m.group(1).strip() + "\n", encoding="utf-8")
          print(open("RELEASE_NOTES.md", encoding="utf-8").read()[:2000])
          PY
      - name: Assets
        run: find artifacts -type f \( -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) -exec ls -l {} \;
      - name: Publish GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/kashshaf-windows/**/*.msi
            artifacts/kashshaf-linux/**/*.AppImage
            artifacts/kashshaf-linux/**/*.deb
            artifacts/kashshaf-macos/**/*.dmg
      - name: Dry run — would publish
        if: env.DRY_RUN == 'true'
        run: echo "would create GitHub release $RELEASE_TAG (draft=false) with the assets above and RELEASE_NOTES.md as body"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  manifest:
    needs: [meta, publish]
    if: needs.meta.outputs.only_api != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Fetch the live app manifest (public read)
        run: curl -fsSL "$CDN_URL/app_manifest.json" -o live_app_manifest.json && python3 -m json.tool live_app_manifest.json
      - name: List the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            # No release exists in a dry run: synthesize the asset list from
            # the naming the builds produce, so the manifest step is exercised.
            V="${RELEASE_TAG#v}"
            python3 - "$V" <<'PY' > assets.json
          import json, sys
          v = sys.argv[1]
          base = f"https://github.com/ammusto/kashshaf/releases/download/v{v}/"
          print(json.dumps([{"name": n, "browser_download_url": base + n} for n in
              (f"Kashshaf_{v}_x64_en-US.msi", f"Kashshaf_{v}_macos.dmg", f"Kashshaf_{v}_amd64.AppImage", f"Kashshaf_{v}_amd64.deb")]))
          PY
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | map({name, browser_download_url})' > assets.json
          fi
          cat assets.json
      - name: Build the new manifest from the actual assets
        run: |
          set -euo pipefail
          # Precedence: workflow_dispatch input, then the tracked marker
          # .release/min_supported_version written by scripts/release.py
          # (part of the tagged commit), else the live value is kept.
          MIN="${{ inputs.min_supported_version }}"
          SRC="workflow input"
          if [ -z "$MIN" ] && [ -f .release/min_supported_version ]; then
            MIN=$(tr -d '\r\n[:space:]' < .release/min_supported_version)
            SRC=".release/min_supported_version"
          fi
          if [ -n "$MIN" ]; then
            case "$MIN" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "min_supported_version '$MIN' from $SRC is not X.Y.Z"; exit 1;; esac
            echo "min_supported_version = $MIN (from $SRC)"
          else
            echo "min_supported_version: no input and no .release/min_supported_version marker; keeping the live manifest's value"
          fi
          python3 scripts/build_app_manifest.py \
            --base live_app_manifest.json --tag "$RELEASE_TAG" --assets assets.json \
            --notes-file RELEASE_NOTES.md ${MIN:+--min-supported-version "$MIN"} \
            $( [ "$DRY_RUN" = "true" ] && echo --no-head ) \
            --out app_manifest.json
          # Small file: print it whole. (`| head` under pipefail fails the step
          # with 32 when head closes the pipe on json.tool.)
          python3 -m json.tool app_manifest.json
          python3 - "$MIN" <<'PY'
          import json, sys
          want, got = sys.argv[1], json.load(open("app_manifest.json"))["min_supported_version"]
          if want and got != want:
              raise SystemExit(f"app_manifest.json min_supported_version is {got}, expected {want}")
          print(f"min_supported_version in the built manifest: {got}")
          PY
      - name: Upload to R2 and verify the round trip
        if: env.DRY_RUN != 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone config create r2 s3 provider Cloudflare access_key_id "$R2_ACCESS_KEY_ID" secret_access_key "$R2_SECRET_ACCESS_KEY" endpoint "$R2_ENDPOINT" acl private >/dev/null
          rclone copyto live_app_manifest.json "r2:$R2_BUCKET/archive/app_manifest.$(date -u +%Y%m%dT%H%M%SZ).json"
          rclone copyto app_manifest.json "r2:$R2_BUCKET/app_manifest.json"
          sleep 5
          curl -fsSL "$CDN_URL/app_manifest.json" -o back.json
          diff <(python3 -m json.tool app_manifest.json) <(python3 -m json.tool back.json) && echo "round trip ok"
          python3 scripts/check_release.py --post-deploy --tag "$RELEASE_TAG" --api "$API_URL" \
            --app-manifest "$CDN_URL/app_manifest.json" --corpus-manifest "$CDN_URL/corpus_manifest.json"
      - name: Dry run — would upload
        if: env.DRY_RUN == 'true'
        run: echo "would archive the live manifest under archive/, upload app_manifest.json to R2, download it back and diff"
      - uses: actions/upload-artifact@v4
        with:
          name: app-manifest
          path: app_manifest.json

  web:
    needs: [meta, publish]
    if: needs.meta.outputs.only_api != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Deploy to Cloudflare Pages (app.kashshaf.com)
        if: env.DRY_RUN != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ vars.CF_PAGES_APP_PROJECT || 'kashshaf-app' }} --branch main
      - name: Dry run — would deploy
        if: env.DRY_RUN == 'true'
        run: |
          echo "would run wrangler pages deploy dist --project-name ${{ vars.CF_PAGES_APP_PROJECT || 'kashshaf-app' }}"
          du -sh dist
