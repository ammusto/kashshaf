# /etc/nginx/conf.d/kashshaf-gzip.conf
#
# http-level compression for the API's JSON. The distro nginx.conf has
# `gzip on;` but leaves `gzip_types` (default: text/html only) and
# `gzip_proxied` (default: off, so nothing from proxy_pass is ever
# compressed) commented out; without these two lines /books went out as
# 39.9 MB of uncompressed JSON. nginx.conf includes conf.d/*.conf inside
# its http block, so this file takes effect without editing nginx.conf.
# Not the site file: that one is per server, this is per http.
#
# Numbers: /books 39,891,666 B -> 3,802,479 B at level 6 (5,967,737 B at the
# default level 1). The box has no brotli module; brotli would be ~1.9 MB.
gzip_types application/json text/plain text/css application/javascript text/javascript application/xml;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
# Vary: Accept-Encoding, so a cache in front never hands a compressed body
# to a client that did not ask for one.
gzip_vary on;
