# /etc/nginx/sites-available/api.kashshaf.com
#
# Reverse proxy for the Kashshaf API (127.0.0.1:3000). TLS certificates are
# managed by certbot (`certbot --nginx -d api.kashshaf.com`), which fills in
# the ssl_certificate lines below on first run. The rate limit here is the
# first line of defence; the API applies its own per-IP limit as well
# (KASHSHAF_RATE_LIMIT in the unit) using X-Forwarded-For / X-Real-IP.
#
# Assumption: the box runs nginx. If it runs Caddy, the equivalent is a
# 20-line Caddyfile (reverse_proxy 127.0.0.1:3000 with the rate_limit
# plugin); the settings below are the ones to carry over.

limit_req_zone $binary_remote_addr zone=kashshaf_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.kashshaf.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kashshaf.com;

    # certbot writes these:
    # ssl_certificate     /etc/letsencrypt/live/api.kashshaf.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.kashshaf.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Same numbers as the in-process limiter: 10 req/s with a burst of 30;
    # nodelay serves the burst immediately instead of queueing it.
    limit_req zone=kashshaf_api burst=30 nodelay;

    client_max_body_size 64k;

    # 429 with the same JSON body shape the API uses.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate limit exceeded; retry in 1 s"}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exact-count walks are off on the server, but a wildcard phrase can
        # still take a couple of seconds on a cold cache.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Cheap endpoints the deploy and the uptime monitor hit; never rate-limited.
    location = /health {
        limit_req off;
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }
}
