# /etc/nginx/sites-available/api.kashshaf.com
#
# Reverse proxy for the Kashshaf API (127.0.0.1:3000). TLS certificates come
# from certbot (`certbot certonly --nginx -d api.kashshaf.com`, run by
# install.sh); the ssl_certificate lines below point at the paths certbot
# uses, so this file passes `nginx -t` on a box that already has the
# certificate. On a fresh box install.sh first installs it WITHOUT the TLS
# server (the block between the "begin/end tls server" markers), obtains
# the certificate through the port-80 server, then installs the full file.
# The rate limit here is the first line of defence; the API applies its own
# per-IP limit as well (KASHSHAF_RATE_LIMIT in the unit) using
# X-Forwarded-For / X-Real-IP.
#
# Assumption: the box runs nginx. If it runs Caddy, the equivalent is a
# 20-line Caddyfile (reverse_proxy 127.0.0.1:3000 with the rate_limit
# plugin); the settings below are the ones to carry over.

limit_req_zone $binary_remote_addr zone=kashshaf_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name api.kashshaf.com;
    return 301 https://$host$request_uri;
}

# --- begin tls server (install.sh strips this block until the certificate exists) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kashshaf.com;

    # Written by certbot (certonly --nginx); renewals replace them in place.
    ssl_certificate     /etc/letsencrypt/live/api.kashshaf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kashshaf.com/privkey.pem;
    # TLS settings inlined (the Mozilla "intermediate" profile certbot ships
    # in options-ssl-nginx.conf) so the site does not depend on files only
    # the certbot *installer* plugin writes. ECDHE key exchange only, so no
    # ssl_dhparam is needed.
    ssl_session_cache shared:kashshaf_ssl:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    client_max_body_size 64k;

    # 429 with the same JSON body shape the API uses. error_page is
    # inherited by the locations below, so the limiter in `location /`
    # answers through it.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate limit exceeded; retry in 1 s"}';
    }

    location / {
        # Same numbers as the in-process limiter: 10 req/s with a burst of
        # 30; nodelay serves the burst immediately instead of queueing it.
        # Set here rather than at server level: nginx has no `limit_req off`,
        # so the only way to exempt /health is for the limiter to live in
        # the locations that want it.
        limit_req zone=kashshaf_api burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exact-count walks are off on the server, but a wildcard phrase can
        # still take a couple of seconds on a cold cache.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # The bulk token fetch (Kashshaf Lab spec §5.1): a whole book as
    # zstd-compressed NDJSON. Not rate-limited here — one call is one book,
    # and the per-request limiter above would refuse a legitimate client
    # after a handful of them. The API applies its own per-client caps (4
    # concurrent, 30 per hour) instead.
    location ~ ^/book/[0-9]+/tokens$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A large book takes tens of seconds to assemble and compress.
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        # Hand the bytes on as they arrive rather than spooling the whole
        # book to disk first.
        proxy_buffering off;
        # The body is already zstd (Content-Encoding: zstd); nginx must not
        # try to gzip it, and must pass the client's If-None-Match through
        # for the 304.
        gzip off;
    }

    # Cheap endpoint the deploy and the uptime monitor hit; never rate-limited
    # (no limit_req directive in this location: that is how an exemption is
    # expressed, there is no `limit_req off`).
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }
}
# --- end tls server ---
