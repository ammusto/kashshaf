[workspace]
members = ["engine", "common", "src-tauri", "api", "lab/src-tauri"]
resolver = "2"

# One version number for the desktop app, the API server and the engine.
# scripts/release.py bumps it; package.json (which tauri.conf.json reads)
# must match, and scripts/check_release.py verifies that.
[workspace.package]
version = "0.7.0"
edition = "2021"

# The release profile used to live in src-tauri/Cargo.toml; profiles are
# only honoured at the workspace root.
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
