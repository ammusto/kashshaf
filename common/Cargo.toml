[package]
name = "kashshaf-common"
version.workspace = true
edition.workspace = true
description = "Data-directory resolution, corpus manifests and download, and settings-DB helpers shared by the Kashshaf desktop app and Kashshaf Lab"

[lib]
name = "kashshaf_common"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.11", features = ["stream", "rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["rt", "sync", "fs"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# Free space on the data directory's volume (download preflight)
fs4 = "0.13"
